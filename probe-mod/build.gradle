apply plugin: 'net.fabricmc.fabric-loom'

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

tasks.named('jar') {
    archiveBaseName = 'hotload-ordinary-probe'
    exclude '**/FailingProbe.class'
}

tasks.register('failureJar', Jar) {
    dependsOn classes
    archiveBaseName = 'hotload-failure-probe'
    from(sourceSets.main.output) { include '**/FailingProbe.class' }
    from('src/failure/resources')
}
