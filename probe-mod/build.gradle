apply plugin: (rootProject.targetSpec.remap ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom')

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.targetSpec.minecraft}"
    if (rootProject.targetSpec.remap) { mappings loom.officialMojangMappings() }
    if (rootProject.targetSpec.remap) {
        modImplementation "net.fabricmc:fabric-loader:${rootProject.targetSpec.loader}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.targetSpec.api}"
    } else {
        implementation "net.fabricmc:fabric-loader:${rootProject.targetSpec.loader}"
        implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.targetSpec.api}"
    }
}

def mcVersion = rootProject.targetSpec.minecraft
def javaVersion = rootProject.targetSpec.java
def releaseVersion = project.version.toString()
tasks.named('processResources') {
    inputs.property 'minecraft', mcVersion
    inputs.property 'java', javaVersion
    filesMatching('fabric.mod.json') { expand minecraft: mcVersion, java: javaVersion }
}
tasks.named('jar') {
    archiveBaseName = 'hotload-ordinary-probe'
    archiveVersion = "${releaseVersion}+mc${mcVersion}"
    exclude '**/FailingProbe.class'
}
if (rootProject.targetSpec.remap) {
    tasks.named('remapJar') {
        archiveBaseName = 'hotload-ordinary-probe'
        archiveVersion = "${releaseVersion}+mc${mcVersion}"
    }
}

tasks.register('failureJar', Jar) {
    dependsOn classes
    archiveBaseName = 'hotload-failure-probe'
    archiveVersion = "${releaseVersion}+mc${mcVersion}"
    from(sourceSets.main.output) { include '**/FailingProbe.class' }
    from('src/failure/resources') { expand minecraft: mcVersion, java: javaVersion }
}
